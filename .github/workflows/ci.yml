name: tests

# The whole suite is offline — a scripted provider stands in for Groq and a
# fake scorer for the local model — so CI needs no API key and no GPU.
on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.11", "3.12", "3.13"]
    steps:
      - uses: actions/checkout@v4

      - name: Set up Python ${{ matrix.python-version }}
        uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
          cache: pip

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          # One resolve pass so fastapi, starlette and mcp land on a mutually
          # consistent set (installing mcp separately used to upgrade starlette
          # past fastapi's pin). torch is NOT needed: the mechanistic tests use
          # a fake scorer and torch is imported lazily.
          pip install -r requirements.txt statsmodels "mcp>=2.0"

      - name: Run the test suite
        run: pytest tests/ -q

      - name: Check every module imports
        run: |
          python -c "import stepwise.pipeline, stepwise.score, stepwise.stats, stepwise.domains"
          python -c "import stepwise.battery, stepwise.battery_score, stepwise.mech"
          python -c "import stepwise.validation, stepwise.judge, stepwise.leakage"
          python -c "import stepwise.interactions"
          python -c "import stepwise.agent.verifier, stepwise.mcp_server"
          python -c "from stepwise.dashboard.app import app"

      # The review guide answers questions with exact file:line references, and
      # a stale one sends a reader to the wrong function. Fail the build rather
      # than let them rot: `python docs/check_review_guide.py --fix` re-points
      # the drifted ones.
      - name: Check the review guide's line references
        run: python docs/check_review_guide.py

      # A simulated run exercises the CLI end to end with no key: the pipeline,
      # scoring, the report card, and the sizing planner.
      - name: Smoke-test the CLI offline
        run: |
          python main.py demo
          python main.py score --dataset demo
          python main.py power --dataset demo
          python main.py report --dataset demo
          python main.py benchmark
